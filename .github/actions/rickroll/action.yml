name: Rickroll
description: Affiche un rickroll si un test Maven échoue.

runs:
  using: composite
  steps:
    - shell: python
      run: |
        import os
        from pathlib import Path
        import xml.etree.ElementTree as ET

        for rapport in Path(".").glob("**/target/*-reports/TEST-*.xml"):
            resultats = ET.parse(rapport).getroot()
            echecs = int(resultats.get("failures", "0"))
            erreurs = int(resultats.get("errors", "0"))

            if echecs > 0 or erreurs > 0:
                gif = "https://user-images.githubusercontent.com/37572049/90699500-0cc3ec00-e2a1-11ea-8d13-989526e86b0e.gif"
                with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as resume:
                    resume.write(f"[![Rickroll]({gif})](https://www.youtube.com/watch?v=dQw4w9WgXcQ)\n")
                break
